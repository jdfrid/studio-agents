<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reelmino — שיווק אורגני</title>
  <style>
    :root { color-scheme: light; --ink: #173d35; --lime: #d9f27a; --paper: #f6f7f2; --line: #d5ddd6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
    header, main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    header { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
    h1 { font-size: 1.4rem; margin: 0; }
    .muted { color: #4d635c; font-size: 0.92rem; }
    #shell { display: grid; grid-template-columns: 12rem 1fr; gap: 1rem; align-items: start; }
    #pages { display: flex; flex-direction: column; gap: 0.35rem; position: sticky; top: 0.75rem; }
    #pages .nav-label { margin: 0.7rem 0 0; font-size: 0.75rem; color: #4d635c; }
    #pages a { display: block; text-decoration: none; background: white; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem 0.7rem; }
    #pages a.active { background: var(--ink); color: var(--lime); border-color: var(--ink); }
    button { background: white; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem 0.7rem; cursor: pointer; }
    button.primary { background: var(--ink); color: var(--lime); border-color: var(--ink); }
    h2 { font-size: 1.05rem; margin: 0.2rem 0 0.5rem; }
    @media (max-width: 800px) {
      #shell { grid-template-columns: 1fr; }
      #pages { position: static; flex-direction: row; flex-wrap: wrap; }
      #pages .nav-label { width: 100%; }
    }
    button.warn { background: #fff; }
    .card { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem; margin: 0.6rem 0; }
    label { display: block; font-size: 0.85rem; margin-top: 0.55rem; }
    input, textarea, select { width: 100%; padding: 0.45rem; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    textarea { min-height: 5rem; direction: ltr; text-align: left; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { border-bottom: 1px solid var(--line); padding: 0.4rem; vertical-align: top; text-align: right; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .error { color: #8d1d1d; }
    .ok { color: #1d6b32; }
    .hidden { display: none; }
    .warn-text { color: #8a5a00; }
    .share { border-inline-start: 4px solid var(--lime); }
    a { color: var(--ink); }
    code { direction: ltr; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Reelmino — מערך שיווק אורגני</h1>
      <p class="muted">פרסום ידני או אוטומטי לערוצי המותג. בלי מודעות בתשלום.</p>
    </div>
    <button id="logout" class="hidden" type="button">יציאה</button>
  </header>
  <main>
    <form id="login" class="card">
      <label>שם<input id="name" autocomplete="username" placeholder="אם יש מפעיל אחד, אפשר להשאיר ריק"></label>
      <label>סיסמה<input id="password" type="password" autocomplete="current-password"></label>
      <p class="row"><button class="primary" type="submit">כניסה</button></p>
      <p id="login-error" class="error"></p>
    </form>
    <section id="app" class="hidden">
      <div id="shell">
        <nav id="pages" aria-label="עמודים">
          <p class="nav-label">עבודה</p>
          <a href="/accounts" data-page="accounts">חשבונות</a>
          <a href="/brand" data-page="own">הפצת המותג</a>
          <a href="/keywords" data-page="keywords">מילות מפתח</a>
          <a href="/scripts" data-page="scripts">מאגר תסריטים</a>
          <a href="/x" data-page="x">X</a>
          <a href="/linkedin" data-page="linkedin">לינקדאין</a>
          <p class="nav-label">עוד</p>
          <a href="/trends" data-page="trends">מגמות</a>
          <a href="/content" data-page="content">תוכן</a>
          <a href="/groups" data-page="groups">קבוצות</a>
          <a href="/calendar" data-page="calendar">לוח</a>
          <a href="/internet" data-page="internet">אינטרנט</a>
          <a href="/results" data-page="results">תוצאות</a>
          <a href="/people" data-page="people">מפעילים</a>
        </nav>
        <div>
          <p id="banner" class="muted"></p>
          <div id="panel"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
